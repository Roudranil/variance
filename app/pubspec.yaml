# Variance — personal finance app
# Local-first, Android-only, double-entry bookkeeping with Material 3 UI.
name: variance
description: "Local-first personal finance tracker with double-entry bookkeeping."
publish_to: 'none'
# Version is founder-controlled — do not bump.
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# ---------------------------------------------------------------------------
# SQLite3MultipleCiphers (sqlite3mc) encryption hook.
# Replaces the deprecated sqlcipher_flutter_libs package.
# Drift 2.32+ / sqlite3 3.x bundles SQLite automatically; no separate
# sqlite3_flutter_libs or sqlcipher_flutter_libs is required.
# ---------------------------------------------------------------------------
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

# ---------------------------------------------------------------------------
# Production dependencies
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  # --- State management & DI ---
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # --- Database & persistence ---
  drift: ^2.31.0

  # --- Navigation ---
  go_router: ^17.2.3

  # --- Data modeling & serialization ---
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # --- Scheduling ---
  workmanager: ^0.9.0

  # --- Notifications ---
  flutter_local_notifications: ^21.0.0

  # --- Exchange rates ---
  http: ^1.6.0

  # --- Theming ---
  dynamic_color: ^1.8.1
  catppuccin_flutter: ^1.0.0

  # --- Security ---
  flutter_secure_storage: ^10.1.0
  local_auth: ^3.0.1

  # --- Internationalisation ---
  intl: ^0.20.2

  # --- File & I/O ---
  path_provider: ^2.1.5
  share_plus: ^13.1.0
  file_picker: ^11.0.2
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0
  path: ^1.9.1

  # --- Utilities ---
  collection: ^1.19.1
  decimal: ^3.2.4

  # --- Icons ---
  material_symbols_icons: ^4.2928.1

# ---------------------------------------------------------------------------
# Development dependencies
# ---------------------------------------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Riverpod code-gen ---
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3

  # --- Drift code-gen ---
  drift_dev: ^2.31.0

  # --- Freezed & JSON code-gen ---
  freezed: ^3.2.5
  json_serializable: ^6.13.2

  # --- Build runner ---
  build_runner: ^2.15.0

  # --- Testing ---
  mocktail: ^1.0.5
  alchemist: ^0.14.0

  # --- Lint ---
  flutter_lints: ^6.0.0

  # --- Build tooling ---
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# ---------------------------------------------------------------------------
# Dependency overrides
# ---------------------------------------------------------------------------
# win32 is a transitive dependency pulled in by file_picker and share_plus.
# Both packages resolve on Android without issue; this override pins the
# single win32 version that satisfies all transitive constraints.
dependency_overrides:
  win32: ^6.1.0
  # Bridge drift_dev (>=8.1.0 <11.0.0) and riverpod_lint (^9.0.0) analyzer requirements.
  analyzer: ^9.0.0

# ---------------------------------------------------------------------------
# Flutter configuration
# ---------------------------------------------------------------------------
flutter:
  uses-material-design: true
  # Assets will be added here as features are built (e.g. currency bundle JSON)
  # assets:
  #   - assets/data/currencies.json
