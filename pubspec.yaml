# Variance — personal finance app
# Local-first, Android-only, double-entry bookkeeping with Material 3 UI.
name: variance
description: "Local-first personal finance tracker with double-entry bookkeeping."
publish_to: 'none'
# Version is founder-controlled — do not bump.
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# ---------------------------------------------------------------------------
# SQLite3MultipleCiphers (sqlite3mc) encryption hook.
# Replaces the deprecated sqlcipher_flutter_libs package.
# Drift 2.32+ / sqlite3 3.x bundles SQLite automatically; no separate
# sqlite3_flutter_libs or sqlcipher_flutter_libs is required.
# ---------------------------------------------------------------------------
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

# ---------------------------------------------------------------------------
# Production dependencies
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  # --- State management & DI ---
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # --- Database & persistence ---
  drift: ^2.33.0

  # --- Navigation ---
  go_router: ^17.2.3

  # --- Data modeling & serialization ---
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # --- Scheduling ---
  workmanager: ^0.9.0

  # --- Notifications ---
  flutter_local_notifications: ^21.0.0

  # --- Exchange rates ---
  http: ^1.6.0

  # --- Theming ---
  dynamic_color: ^1.8.1
  catppuccin_flutter: ^1.0.0

  # --- Security ---
  flutter_secure_storage: ^10.1.0
  local_auth: ^3.0.1

  # --- Internationalisation ---
  intl: ^0.20.2

  # --- File & I/O ---
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  file_picker: ^11.0.2
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0
  path: ^1.9.1

  # --- Utilities ---
  collection: ^1.19.1
  decimal: ^3.2.4

  # --- Icons ---
  material_symbols_icons: ^4.2928.1

# ---------------------------------------------------------------------------
# Development dependencies
# ---------------------------------------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Riverpod code-gen ---
  riverpod_generator: ^4.0.3
  # riverpod_lint dropped — requires analyzer ^9.0.0 only; incompatible with
  # json_serializable (>=10) and drift_dev (>=10). Optional lint tool.

  # --- Drift code-gen ---
  drift_dev: ^2.33.0

  # --- Freezed & JSON code-gen ---
  freezed: ^3.2.5
  json_serializable: ^6.13.2

  # --- Build runner ---
  build_runner: ^2.15.0

  # --- Testing ---
  mocktail: ^1.0.5
  alchemist: ^0.14.0

  # --- Lint ---
  flutter_lints: ^6.0.0

  # --- Build tooling ---
  # Removed temporarily — not needed until assets/icons are configured.
  # flutter_launcher_icons: ^0.14.4
  # flutter_native_splash: ^2.4.7

# ---------------------------------------------------------------------------
# Dependency overrides
# ---------------------------------------------------------------------------
# win32 is a transitive dependency pulled in by file_picker, share_plus, and
# flutter_secure_storage_windows. share_plus >=13 requires win32 ^6.x which is
# incompatible with file_picker 11.x (^5.9.0) and flutter_secure_storage_windows
# 4.x (^5.5.4). Pinned to share_plus ^12.0.2 (win32 ^5.5.3) so all three align
# on win32 5.x. The override locks the highest 5.x satisfying all three constraints.
dependency_overrides:
  win32: ^5.9.0
  # Nail down the 10.x range: freezed <11, json_serializable >=10, drift_dev >=10 <13.
  analyzer: ^10.0.0
  # dart_style 3.1.9 requires analyzer ^13 (incompatible). 3.1.7 requires >=10 <12 — matches.
  dart_style: 3.1.7

# ---------------------------------------------------------------------------
# Flutter configuration
# ---------------------------------------------------------------------------
flutter:
  uses-material-design: true
  assets:
    # Bundled ISO 4217 currency reference — seeded into the currencies table
    # at first launch and held in a keepAlive Riverpod provider. No runtime
    # network fetch. See SDS §2.16.1 and T-21.
    - assets/data/currencies.json
