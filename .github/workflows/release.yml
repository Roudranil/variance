name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches version file
        run: |
          canonical=$(tr -d '[:space:]' < version)
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$canonical" != "$tag" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match version file (${canonical})"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Sync version to pubspec
        run: ./scripts/sync-version.sh ${{ github.run_number }}

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze lib/

      - name: Test
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info/

      - name: Rename APK
        run: |
          version=$(tr -d '[:space:]' < version)
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/variance-${version}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/variance-*.apk
